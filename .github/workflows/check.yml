name: Check
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build pinned toolchain
        run: docker build --platform linux/amd64 -f build-support/Dockerfile -t quarantine-build .
      - name: Compile, unit tests, and lint
        run: |
          mkdir -p dist/check
          docker run --rm --platform linux/amd64 -v "$PWD:/src:ro" -v "$PWD/dist/check:/out" quarantine-build assembleDebug assembleRelease testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-and-reports
          path: dist/check
  device-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.18+8'
      - name: Prepare emulator
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "system-images;android-$TEST_API;google_apis;x86_64"
          echo no | avdmanager create avd --name quarantine-test --package "system-images;android-$TEST_API;google_apis;x86_64" --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd quarantine-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent 82
      - name: Run device tests
        run: ./gradlew --no-daemon --dependency-verification strict connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: device-tests-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            emulator.log
